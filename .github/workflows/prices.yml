name: price-update
# Price-only refresh between hourly research editions (:55 PT job runs elsewhere).
# Cron is UTC, but minutes are zone-independent: runs at :10, :25 and :40 every hour.
# Note: GitHub may delay scheduled runs by several minutes at busy times.
on:
  schedule:
    - cron: "10,25,40 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Update prices, commit and push if changed
        id: commit
        env:
          FEED_BASE_URL: https://water-bear86.github.io/trenches-feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "changed=false" >> "$GITHUB_OUTPUT"
          for i in 1 2 3; do
            # always rebuild on top of the newest main (a fresh research edition may have just landed)
            git fetch -q origin main && git reset -q --hard origin/main
            python3 update_prices.py   # stdlib only; exits 0 and leaves files unchanged if all APIs fail
            git add -A
            if git diff --cached --quiet; then echo "No changes."; exit 0; fi
            git commit -q -m "Price update $(TZ=America/Los_Angeles date '+%Y-%m-%d %H:%M %Z')"
            if git push -q origin HEAD:main; then echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            echo "push rejected (main moved); retrying"; sleep 5
          done
          exit 1
      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so deploy Pages here.
      - uses: actions/configure-pages@v5
        if: steps.commit.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.commit.outputs.changed == 'true'
        with:
          path: .
      - id: deploy
        if: steps.commit.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
