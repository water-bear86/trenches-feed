name: price-update (disabled)
# DISABLED (gh workflow disable prices.yml). The station now fills all price/market variables itself
# (e.g. Pyth feeds via Helius RPC), so the published feed leaves {{BTC_PRICE}}-style variables unfilled.
# No schedule. Kept only as a manual smoke test of the optional helper; it never modifies published files.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  helper-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 update_prices.py
